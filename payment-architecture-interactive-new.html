  <style>

    .no-scrollbar::-webkit-scrollbar {
      display: none;

      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {

    </div>
  </main>

  <script>
    const scenarios = JSON.parse(decodeURIComponent("%5B%7B%22id%22%3A%22pt-1-own%22%2C%22name%22%3A%22PT-1%3A%20Own%20Account%22%2C%22description%22%3A%22Transfer%20between%20two%20accounts%20owned%20by%20the%20same%20customer%20within%20the%20same%20bank.%22%2C%22nodes%22%3A%5B%7B%22id%22%3A%22initiation%22%2C%22title%22%3A%221.%20Initiation%22%2C%22description%22%3A%22Customer%20initiates%20transfer%20between%20their%20own%20accounts.%22%2C%22stakeholders%22%3A%5B%22Customer%22%5D%2C%22systems%22%3A%5B%22Mobile%2FWeb%20Banking%20App%22%5D%2C%22regulations%22%3A%5B%22SCA%20(Strong%20Customer%20Authentication)%22%5D%2C%22concepts%22%3A%5B%22SCA%20%26%20KYC%22%5D%2C%22details%22%3A%22The%20customer%20logs%20into%20their%20banking%20app%20and%20selects%20two%20accounts%20they%20own%20(e.g.%2C%20Checking%20to%20Savings).%20Since%20both%20accounts%20belong%20to%20the%20same%20verified%20entity%2C%20friction%20is%20minimal.%22%2C%22iconName%22%3A%22user%22%7D%2C%7B%22id%22%3A%22core-banking%22%2C%22title%22%3A%222.%20Core%20Banking%20Processing%22%2C%22description%22%3A%22The%20bank's%20internal%20ledger%20updates%20the%20balances.%22%2C%22stakeholders%22%3A%5B%22Bank%20Operations%22%5D%2C%22systems%22%3A%5B%22Core%20Banking%20System%20(CBS)%22%5D%2C%22regulations%22%3A%5B%22Internal%20Audit%20%26%20Logging%22%5D%2C%22concepts%22%3A%5B%22Clearing%20vs%20Settlement%22%5D%2C%22details%22%3A%22The%20Core%20Banking%20System%20performs%20a%20simple%20%5C%22book%20transfer%5C%22.%20It%20debits%20the%20source%20account%20and%20credits%20the%20destination%20account%20simultaneously.%20No%20external%20networks%20or%20complex%20AML%20checks%20are%20required%20since%20the%20entity%20is%20the%20same.%22%2C%22iconName%22%3A%22server%22%7D%2C%7B%22id%22%3A%22settlement%22%2C%22title%22%3A%223.%20Instant%20Settlement%22%2C%22description%22%3A%22Funds%20are%20immediately%20available.%22%2C%22stakeholders%22%3A%5B%22Customer%22%5D%2C%22systems%22%3A%5B%22Customer%20Notification%20System%22%5D%2C%22regulations%22%3A%5B%22Internal%20Ledger%20Rules%22%5D%2C%22concepts%22%3A%5B%22Clearing%20vs%20Settlement%22%5D%2C%22details%22%3A%22Because%20the%20funds%20never%20leave%20the%20bank%2C%20settlement%20is%20instantaneous.%20The%20customer%20sees%20the%20updated%20balances%20immediately%2C%20and%20no%20interbank%20settlement%20is%20needed.%22%2C%22iconName%22%3A%22check-circle2%22%7D%5D%7D%2C%7B%22id%22%3A%22pt-1-internal%22%2C%22name%22%3A%22PT-1%3A%20Internal%20(Other%20Account)%22%2C%22description%22%3A%22Transfer%20to%20another%20customer's%20account%20within%20the%20same%20bank.%22%2C%22nodes%22%3A%5B%7B%22id%22%3A%22initiation%22%2C%22title%22%3A%221.%20Initiation%22%2C%22description%22%3A%22Sender%20initiates%20a%20transfer%20to%20another%20customer%20at%20the%20same%20bank.%22%2C%22stakeholders%22%3A%5B%22Payer%22%5D%2C%22systems%22%3A%5B%22Mobile%20Banking%20App%22%2C%22Online%20Portal%22%5D%2C%22regulations%22%3A%5B%22SCA%20(Strong%20Customer%20Authentication)%22%5D%2C%22concepts%22%3A%5B%22SCA%20%26%20KYC%22%2C%22APP%20Fraud%22%5D%2C%22details%22%3A%22The%20payer%20enters%20the%20payee's%20account%20details.%20Since%20the%20payee%20is%20in%20the%20same%20bank%2C%20the%20system%20can%20often%20instantly%20verify%20the%20payee's%20name%20(Confirmation%20of%20Payee).%22%2C%22iconName%22%3A%22user%22%7D%2C%7B%22id%22%3A%22fraud-aml%22%2C%22title%22%3A%222.%20Fraud%20%26%20AML%20Check%22%2C%22description%22%3A%22Internal%20screening%20for%20suspicious%20activity.%22%2C%22stakeholders%22%3A%5B%22Fraud%20Prevention%20Team%22%2C%22Compliance%20Officer%22%5D%2C%22systems%22%3A%5B%22Fraud%20Detection%20Engine%22%2C%22Transaction%20Monitoring%20System%22%5D%2C%22regulations%22%3A%5B%22AML%20(Anti-Money%20Laundering)%22%2C%22Internal%20Risk%20Policies%22%5D%2C%22concepts%22%3A%5B%22AML%20%26%20Monitoring%22%2C%22Screening%20vs%20Monitoring%22%5D%2C%22details%22%3A%22Even%20though%20it%20is%20an%20internal%20transfer%2C%20the%20bank%20must%20monitor%20for%20money%20laundering%20or%20account%20takeover%20fraud.%20The%20system%20checks%20if%20the%20transaction%20fits%20the%20customer's%20normal%20behavior.%22%2C%22iconName%22%3A%22shield-check%22%7D%2C%7B%22id%22%3A%22core-banking%22%2C%22title%22%3A%223.%20Book%20Transfer%22%2C%22description%22%3A%22Internal%20ledger%20updates%20both%20accounts.%22%2C%22stakeholders%22%3A%5B%22Bank%20Operations%22%5D%2C%22systems%22%3A%5B%22Core%20Banking%20System%20(CBS)%22%5D%2C%22regulations%22%3A%5B%22Record%20Keeping%20Requirements%22%5D%2C%22concepts%22%3A%5B%22Clearing%20vs%20Settlement%22%5D%2C%22details%22%3A%22Once%20cleared%20by%20the%20fraud%20engine%2C%20the%20Core%20Banking%20System%20debits%20the%20sender%20and%20credits%20the%20receiver.%20No%20external%20clearing%20house%20is%20involved.%22%2C%22iconName%22%3A%22server%22%7D%2C%7B%22id%22%3A%22settlement%22%2C%22title%22%3A%224.%20Settlement%22%2C%22description%22%3A%22Funds%20are%20credited%20to%20the%20payee.%22%2C%22stakeholders%22%3A%5B%22Payee%22%5D%2C%22systems%22%3A%5B%22Notification%20Gateway%22%5D%2C%22regulations%22%3A%5B%22Consumer%20Protection%20Laws%22%5D%2C%22concepts%22%3A%5B%22Clearing%20vs%20Settlement%22%5D%2C%22details%22%3A%22The%20payee%20receives%20the%20funds%20instantly.%20The%20transaction%20is%20final%20and%20irrevocable%20within%20the%20bank's%20internal%20closed-loop%20system.%22%2C%22iconName%22%3A%22check-circle2%22%7D%5D%7D%2C%7B%22id%22%3A%22pt-2-local%22%2C%22name%22%3A%22PT-2%3A%20Local%20Bank%20to%20Bank%22%2C%22description%22%3A%22Domestic%20transfer%20between%20two%20different%20local%20banks.%22%2C%22nodes%22%3A%5B%7B%22id%22%3A%22initiation%22%2C%22title%22%3A%221.%20Initiation%22%2C%22description%22%3A%22Payer%20initiates%20a%20domestic%20transfer.%22%2C%22stakeholders%22%3A%5B%22Payer%22%5D%2C%22systems%22%3A%5B%22Banking%20App%22%5D%2C%22regulations%22%3A%5B%22SCA%22%2C%22Confirmation%20of%20Payee%20(CoP)%22%5D%2C%22concepts%22%3A%5B%22SCA%20%26%20KYC%22%2C%22APP%20Fraud%22%5D 20vs%20Card%20Not%20Present%20(CNP)%22%2C%22description%22%3A%22CP%20transactions%20happen%20in-store%20via%20a%20physical%20terminal%20(POS).%20CNP%20transactions%20happen%20online%20or%20over%20the%20phone.%20CP%20generally%20has%20lower%20fraud%20risk%20and%20lower%20interchange%20fees%20compared%20to%20CNP.%22%7D%2C%22EMV%20%26%20NFC%22%3A%7B%22title%22%3A%22EMV%20%26%20NFC%22%2C%22description%22%3A%22EMV%20(Europay%2C%20Mastercard%2C%20Visa)%20is%20the%20global%20standard%20for%20chip%20cards%2C%20generating%20dynamic%20cryptograms%20for%20each%20transaction.%20NFC%20(Near%20Field%20Communication)%20enables%20contactless%20payments%20via%20tap-to-pay%20(cards%20or%20phones).%22%7D%2C%223D%20Secure%22%3A%7B%22title%22%3A%223D%20Secure%20(3DS)%22%2C%22description%22%3A%22An%20authentication%20protocol%20for%20online%20(CNP)%20transactions%20(e.g.%2C%20Verified%20by%20Visa%2C%20Mastercard%20Identity%20Check).%20It%20redirects%20the%20buyer%20to%20their%20issuing%20bank%20to%20verify%20their%20identity%20(via%20OTP%20or%20app%20approval)%20before%20payment%20authorization.%20Crucially%2C%20a%20successful%203DS%20check%20shifts%20fraud%20liability%20from%20the%20merchant%20to%20the%20issuer.%22%7D%2C%22Liability%20Shift%22%3A%7B%22title%22%3A%22Liability%20Shift%22%2C%22description%22%3A%22A%20rule%20in%20card%20payments%20determining%20who%20pays%20for%20fraudulent%20chargebacks.%20In%20CNP%20transactions%2C%20merchants%20usually%20bear%20the%20cost.%20However%2C%20if%20the%20merchant%20uses%203D%20Secure%20and%20the%20issuer%20approves%20the%20authentication%2C%20the%20liability%20shifts%20to%20the%20issuing%20bank.%22%7D%2C%22PCI-DSS%22%3A%7B%22title%22%3A%22PCI-DSS%22%2C%22description%22%3A%22Payment%20Card%20Industry%20Data%20Security%20Standard.%20A%20set%20of%20security%20standards%20designed%20to%20ensure%20that%20all%20companies%20that%20accept%2C%20process%2C%20store%20or%20transmit%20credit%20card%20information%20maintain%20a%20secure%20environment%20to%20prevent%20data%20breaches.%22%7D%2C%22GDPR%20%26%20Data%20Privacy%22%3A%7B%22title%22%3A%22GDPR%20%26%20Data%20Privacy%22%2C%22description%22%3A%22General%20Data%20Protection%20Regulation%20(GDPR)%20is%20an%20EU%20law%20governing%20data%20protection%20and%20privacy.%20In%20payments%2C%20it%20strictly%20regulates%20how%20personal%20identifiable%20information%20(PII)%20of%20payers%20and%20payees%20is%20collected%2C%20stored%2C%20and%20shared%20across%20borders.%22%7D%2C%22PSD2%20%26%20Open%20Banking%22%3A%7B%22title%22%3A%22PSD2%20%26%20Open%20Banking%22%2C%22description%22%3A%22The%20Second%20Payment%20Services%20Directive%20(PSD2)%20is%20an%20EU%20regulation%20that%20mandated%20Strong%20Customer%20Authentication%20(SCA)%20for%20online%20payments%20and%20forced%20banks%20to%20open%20their%20data%20to%20third-party%20providers%20via%20APIs%20(Open%20Banking).%22%7D%2C%22Chargeback%22%3A%7B%22title%22%3A%22Chargeback%20%26%20Disputes%22%2C%22description%22%3A%22A%20chargeback%20is%20a%20forced%20reversal%20of%20a%20card%20transaction%20initiated%20by%20the%20issuing%20bank%2C%20usually%20because%20the%20cardholder%20disputes%20the%20charge%20(e.g.%2C%20fraud%2C%20goods%20not%20received).%20It%20protects%20consumers%20but%20is%20costly%20for%20merchants.%22%7D%2C%22BNPL%22%3A%7B%22title%22%3A%22Buy%20Now%2C%20Pay%20Later%20(BNPL)%22%2C%22description%22%3A%22A%20type%20of%20short-term%20financing%20allowing%20consumers%20to%20make%20purchases%20and%20pay%20for%20them%20in%20future%20installments%2C%20often%20interest-free.%20The%20BNPL%20provider%20pays%20the%20merchant%20upfront%20(minus%20a%20fee)%20and%20takes%20on%20the%20consumer%20credit%20risk.%22%7D%2C%22A2A%22%3A%7B%22title%22%3A%22Account-to-Account%20(A2A)%20Payments%22%2C%22description%22%3A%22Payments%20that%20move%20money%20directly%20from%20the%20payer's%20bank%20account%20to%20the%20payee's%20bank%20account%2C%20bypassing%20traditional%20card%20networks%20(Visa%2FMastercard).%20Often%20powered%20by%20Open%20Banking%20APIs%20(PISP)%20or%20real-time%20payment%20rails.%22%7D%2C%22VCN%22%3A%7B%22title%22%3A%22Virtual%20Card%20Numbers%20(VCN)%22%2C%22description%22%3A%22Temporary%2C%20randomly%20generated%2016-digit%20card%20numbers%20linked%20to%20a%20real%20funding%20account.%20Used%20extensively%20in%20B2B%20payments%20(e.g.%2C%20corporate%20travel%2C%20supplier%20payments)%20for%20security%2C%20spend%20control%2C%20and%20automated%20reconciliation.%22%7D%2C%22DCC%22%3A%7B%22title%22%3A%22Dynamic%20Currency%20Conversion%20(DCC)%22%2C%22description%22%3A%22A%20service%20offered%20at%20POS%20or%20ATMs%20abroad%20allowing%20consumers%20to%20pay%20in%20their%20home%20currency%20rather%20than%20the%20local%20currency.%20While%20convenient%2C%20the%20exchange%20rate%20is%20set%20by%20the%20merchant's%20acquirer%2C%20often%20including%20a%20high%20markup.%22%7D%2C%22Virtual%20Accounts%22%3A%7B%22title%22%3A%22Virtual%20Accounts%20(POBO%2FROBO)%22%2C%22description%22%3A%22Sub-accounts%20linked%20to%20a%20physical%20master%20bank%20account%2C%20used%20by%20large%20corporates%20for%20easier%20reconciliation.%20Payments%20can%20be%20made%20%5C%22On%20Behalf%20Of%5C%22%20(POBO)%20or%20received%20%5C%22On%20Behalf%20Of%5C%22%20(ROBO)%20underlying%20entities%20or%20subsidiaries.%22%7D%7D"));

    function renderTabs() {
      const tabsHtml = scenarios.map((scenario, index) => {
        const isActive = index === activeScenarioIndex;
        const classes = isActive 
          ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30'

        return `<button onclick="setScenario(${index})" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-all ${classes}">${scenario.name}</button>`;
      }).join('');

    }

    function renderScenario() {
      const scenario = scenarios[activeScenarioIndex];
      scenarioTitleEl.textContent = scenario.name;
      scenarioDescEl.textContent = scenario.description;
      
      renderNodes();
      renderDetails();
    }

    function renderNodes() {
      const scenario = scenarios[activeScenarioIndex];
      
      nodesContainerEl.innerHTML = scenario.nodes.map((node, index) => {
        const isActive = index === activeNodeIndex;
        const isPast = index < activeNodeIndex;
        
        const circleClasses = isActive
          ? 'bg-slate-900 border-cyan-400 shadow-[0_0_30px_rgba(34,211,238,0.2)]'
          : isPast
          ? 'bg-slate-900 border-slate-600'
          : 'bg-slate-950 border-slate-800 hover:border-slate-600';
          
        const iconClasses = isActive
          ? 'text-cyan-400'
          : isPast
          ? 'text-slate-400'
          : 'text-slate-600';
          
        const titleClasses = isActive ? 'text-white' : 'text-slate-400 group-hover:text-slate-300';
        
        const activeRing = isActive 
          ? `<div class="absolute -inset-2 border border-cyan-400/30 rounded-3xl transition-all duration-300"></div>`
          : '';

        return `
          <div onclick="setNode(${index})" class="flex md:flex-col items-center gap-4 md:gap-4 cursor-pointer group relative w-full flex-1 flex-shrink-0">
            <div class="relative w-16 h-16 rounded-2xl flex items-center justify-center border-2 transition-all duration-500 z-10 flex-shrink-0 ${circleClasses}">

          </div>
        `;
      }).join('');
      
      lucide.createIcons();
    }

    function renderDetails() {
      const scenario = scenarios[activeScenarioIndex];
      const node = scenario.nodes[activeNodeIndex];
      
      // Fade out, update, fade in
      detailsSectionEl.classList.remove('opacity-100');
      detailsSectionEl.classList.add('opacity-0');
      
      setTimeout(() => {
        // Badges
        let badgesHtml = `<span class="px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-400 text-xs font-mono uppercase tracking-wider border border-cyan-500/20">Node ${activeNodeIndex + 1} of ${scenario.nodes.length}</span>`;
        
        if (node.concepts && node.concepts.length > 0) {
          badgesHtml += node.concepts.map(concept => 
            `<span class="px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 text-xs font-mono uppercase tracking-wider border border-amber-500/20 flex items-center gap-1">
              <i data-lucide="lightbulb" class="w-3 h-3"></i> ${concept}
            </span>`
          ).join('');
        }
        nodeBadgesEl.innerHTML = badgesHtml;
        
        nodeTitleEl.textContent = node.title;
        nodeDetailsEl.textContent = node.details;
        
        // Lists
        const createListItems = (items, colorClass) => items.map(item => 
          `<li class="flex items-start gap-3 text-sm text-slate-300">
            <i data-lucide="chevron-right" class="w-4 h-4 ${colorClass} mt-0.5 flex-shrink-0"></i>
            <span>${item}</span>
          </li>`
        ).join('');
        
        nodeStakeholdersEl.innerHTML = createListItems(node.stakeholders, 'text-blue-400/50');
        nodeSystemsEl.innerHTML = createListItems(node.systems, 'text-purple-400/50');
        nodeRegulationsEl.innerHTML = createListItems(node.regulations, 'text-emerald-400/50');
        
        // Concepts
        if (node.concepts && node.concepts.length > 0) {
          conceptsContainerWrapperEl.classList.remove('hidden');
          nodeConceptsEl.innerHTML = node.concepts.map(conceptKey => {
            const concept = concepts[conceptKey];
            if (!concept) return '';
            return `
              <div class="bg-slate-950/50 rounded-2xl p-5 border border-slate-800/50">
                <h4 class="text-amber-400 font-medium mb-2 flex items-center gap-2">
                  <i data-lucide="lightbulb" class="w-4 h-4"></i>
                  ${concept.title}
                </h4>
                <p class="text-sm text-slate-400 leading-relaxed">${concept.description}</p>
              </div>
            `;
          }).join('');
        } else {
          conceptsContainerWrapperEl.classList.add('hidden');
        }
        
        lucide.createIcons();
        
        detailsSectionEl.classList.remove('opacity-0');
        detailsSectionEl.classList.add('opacity-100');
      }, 150);
    }

    window.setScenario = function(index) {
      activeScenarioIndex = index;
      activeNodeIndex = 0;
      isPlaying = false;
      updatePlayButton();
      renderTabs();
      renderScenario();
    };

    window.setNode = function(index) {
      activeNodeIndex = index;
      isPlaying = false;
      updatePlayButton();
      renderNodes();
      renderDetails();
    };

    function setupAutoPlay() {
      autoPlayBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        updatePlayButton();
        
        if (isPlaying) {
          playInterval = setInterval(() => {
            const scenario = scenarios[activeScenarioIndex];
            activeNodeIndex = (activeNodeIndex + 1) % scenario.nodes.length;
            renderNodes();
            renderDetails();
          }, 5000);
        } else {
          clearInterval(playInterval);
        }
      });
    }

    function updatePlayButton() {
      if (isPlaying) {
        autoPlayBtn.className = 'flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all bg-cyan-500/10 text-cyan-400 border border-cyan-500/20';
        autoPlayBtn.innerHTML = `<i data-lucide="pause" class="w-4 h-4"></i><span class="hidden sm:inline">Auto-Play On</span>`;
      } else {
        autoPlayBtn.className = 'flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700';
        autoPlayBtn.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span class="hidden sm:inline">Auto-Play Off</span>`;
      }
      lucide.createIcons();
    }

    // Start
    init();
  </script>
</body>
</html>
